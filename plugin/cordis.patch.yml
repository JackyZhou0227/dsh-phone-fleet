- insert:
    - id: phone-fleet
      name: 'dsh-phone-fleet'
      config:
        adbPath: adb
        hdcPath: hdc
        autoProvision: true
        wdaBaseUrl: ''
        streamMaxFps: 30
        streamMaxSize: 1024
        uiDumpTimeoutMs: 20000
        uiDumpAttempts: 2
        pauseOnIdle: true
        uiQueueLimit: 6